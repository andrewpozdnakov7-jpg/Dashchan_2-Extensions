apply plugin: 'chan-extension'

chan {
	versionName '1.43-experimental-1.6-r10'
	apiVersion 1
	hosts '2ch.hk', '2ch.pm', '2ch.life',
			'2ch.cm', '2ch.re', '2ch.tf', '2ch.wf', '2ch.yt', '2-ch.so',
			'beta.2ch.hk'
}

android {
	defaultConfig {
		versionCode 7
	}
}

afterEvaluate {
	def generateManifestTask = tasks.findByName('generateManifest')
	if (generateManifestTask != null) {
		generateManifestTask.doLast {
			def manifestFile = file("$buildDir/generated/AndroidManifest.xml")
			def manifestText = manifestFile.text
			manifestText = manifestText
					.replace('android:label="Dashchan for 2ch.hk"', 'android:label="Dashchan_2 for 2ch"')
					.replace('android:label="Dashchan"', 'android:label="Dashchan_2"')
			manifestFile.text = manifestText
		}
	}
}
